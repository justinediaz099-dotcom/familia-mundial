      function calcScore(member, teamStatuses) {

        let pts = 0;

        member.teams.forEach(teamName => {

          const s = teamStatuses[teamName] || {};

          pts += (s.groupWins || 0) * POINTS.groupStageWin;

          pts += (s.groupDraws || 0) * POINTS.groupStageDraw;

          if (s.roundOf32) pts += POINTS.roundOf32;
        if (s.roundOf16) pts += POINTS.roundOf16;

          if (s.quarterFinal) pts += POINTS.quarterFinal;

          if (s.semiFinal) pts += POINTS.semiFinal;

          if (s.runnerUp) pts += POINTS.runnerUp;

          if (s.champion) pts += POINTS.champion;

        });

        return pts;

      }

        'Mexico','Ecuador','England','DR Congo','Belgium','Senegal',

        'Switzerland','Algeria','Australia','Egypt','Argentina','Cabo Verde',
        'Colombia','Ghana'
      ]);

      function getTeamStage(teamName, teamStatuses, koMatches) {

        const s = teamStatuses[teamName] || {};
        const km = koMatches || [];

        if (s.champion) return 'champion';

        if (s.runnerUp || s.semiFinal || s.quarterFinal || s.roundOf32 || s.roundOf16) return 'advancing';

        if (s.eliminated) return 'eliminated';

        // Group stage complete — teams not in R32 are eliminated
        if (!R32_TEAMS.has(teamName)) return 'eliminated';

        // KO round — check if this team lost a played match (and has no advancing flag)
        const hasAdvanced = s.roundOf32 || s.roundOf16 || s.quarterFinal || s.semiFinal || s.runnerUp || s.champion;
        if (!hasAdvanced) {
          const lostKO = km.some(match => {
            if (!match.played) return false;
            const loser = match.hscore > match.ascore ? match.away
                        : match.ascore > match.hscore ? match.home
                        : null;
            return loser === teamName;
          });
          if (lostKO) return 'eliminated';
        }

        return 'active';

      }

                    return null; // draw — manually set winner for ET/pens
                  };

                  const r32W = id => mWin(KO_MATCHES.find(m => m.round === 'r32' && m.matchId === id));

                  const r16W = id => {
                    const stored = KO_MATCHES.find(m => m.round === 'r16' && m.matchId === id);
                    if (stored && stored.home && stored.away) return mWin(stored);
                    const a = r32W(id * 2), b = r32W(id * 2 + 1);
                    if (!a || !b) return null;
                    return mWin({ ...stored, home: a, away: b });
                  };

                  const qfW = id => {
                    const stored = KO_MATCHES.find(m => m.round === 'qf' && m.matchId === id);
                    if (stored && stored.home && stored.away) return mWin(stored);
                    const a = r16W(id * 2), b = r16W(id * 2 + 1);
                    if (!a || !b) return null;
                    return mWin({ ...stored, home: a, away: b });
                  };

                  const sfW = id => {
                    const stored = KO_MATCHES.find(m => m.round === 'sf' && m.matchId === id);
                    if (stored && stored.home && stored.away) return mWin(stored);
                    const a = qfW(id * 2), b = qfW(id * 2 + 1);
                    if (!a || !b) return null;
                    return mWin({ ...stored, home: a, away: b });
                  };

                  const finalW = () => {
                    const stored = KO_MATCHES.find(m => m.round === 'f' && m.matchId === 0);
                    if (stored && stored.home && stored.away) return mWin(stored);
                    const a = sfW(0), b = sfW(1);
                    if (!a || !b) return null;
                    return mWin({ ...stored, home: a, away: b });
                  };

                  const champion = finalW();

                  // Slot helpers
                  const getFlag3 = name => (name && name !== 'TBD') ? (ALL_TEAMS.find(t => t.name === name)?.flag || '') : '';
                  const getOwner3 = name => name ? members.find(m => m.teams.includes(name)) : null;
                  const ownerColors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f43','#a29bfe','#fd79a8','#00cec9','#e17055','#74b9ff','#55efc4','#fdcb6e','#e84393','#0984e3','#00b894','#b2bec3'];
                  const getOwnerColor = name => {
                    const owner = getOwner3(name);
                    if (!owner) return 'rgba(255,255,255,0.15)';
                    return ownerColors[members.findIndex(m => m.id === owner.id) % ownerColors.length];
                  };

                  // SlotCard — flag + team name + owner badge
                  const SlotCard = ({ label }) => {
                    const isTBD = !label || label === 'TBD';
                    const isReal = !isTBD && ALL_TEAMS.some(t => t.name === label);
                    const flag = isReal ? getFlag3(label) : '';
                    const owner = isReal ? getOwner3(label) : null;
                    const ownerColor = isReal ? getOwnerColor(label) : 'rgba(255,255,255,0.15)';
                    return (
                      <div style={{
                        background: isTBD ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.06)',
                        border: isTBD ? '1px solid rgba(255,255,255,0.04)' : '1px solid rgba(255,255,255,0.14)',
                        borderLeft: isTBD ? '3px solid rgba(255,255,255,0.05)' : ('3px solid ' + ownerColor),
                        borderRadius: 8, padding: '6px 10px', minWidth: 150, maxWidth: 165,
                      }}>
                        <div style={{ display:'flex', alignItems:'center', gap:7 }}>
                          <span style={{ fontSize:18, lineHeight:1, flexShrink:0 }}>{isTBD ? '⏳' : flag}</span>
                          <div style={{ overflow:'hidden' }}>
                            <div style={{
                              fontSize:12, fontWeight:700,
                              color: isTBD ? 'rgba(255,255,255,0.2)' : '#fff',
                              whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
                            }}>{isTBD ? 'TBD' : label}</div>
                            {isReal && owner && (
                              <div style={{ fontSize:9, color:ownerColor, marginTop:1, fontWeight:600 }}>
                                {owner.emoji} {owner.name}
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  };

                  // MatchPair card — two SlotCards with divider
                  const MatchPair = ({ top, bot }) => (
                    <div style={{
                      display:'flex', flexDirection:'column', gap:2,
                      background: 'rgba(255,255,255,0.025)',
                      border:'1px solid rgba(255,255,255,0.07)',
                      borderRadius:10, padding:'5px 5px',
                    }}>
                      <SlotCard label={top} />
                      <div style={{ height:1, background: 'rgba(255,255,255,0.06)', margin:'2px 4px' }} />
                      <SlotCard label={bot} />
                    </div>
                  );

                  const ColHeader = ({ label, pts }) => (
                    <div style={{ marginBottom:10, paddingLeft:4 }}>
                      <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.5)', letterSpacing:2, textTransform:'uppercase' }}>{label}</div>
                      <div style={{ fontSize:11, color:'#ffd700', fontWeight:700, letterSpacing:1, marginTop:2 }}>{pts}</div>
                    </div>
                  );

                  const Connector = () => (
                    <div style={{ display:'flex', alignItems:'center', alignSelf:'stretch' }}>
                      <div style={{ width:18, height:2, background: 'rgba(255,255,255,0.1)' }} />
                    </div>
                  );

                  // Build pair arrays
                  const r32Pairs = Array.from({length:16}, (_,i) => {
                    const m = KO_MATCHES.find(x => x.round === 'r32' && x.matchId === i);
                    return { top: m.home, bot: m.away };
                  });
                  const r16Pairs = Array.from({length:8}, (_,i) => ({ top: r32W(i*2)||'TBD', bot: r32W(i*2+1)||'TBD' }));
                  const qfPairs  = Array.from({length:4}, (_,i) => ({ top: r16W(i*2)||'TBD', bot: r16W(i*2+1)||'TBD' }));
                  const sfPairs  = Array.from({length:2}, (_,i) => ({ top: qfW(i*2)||'TBD',  bot: qfW(i*2+1)||'TBD'  }));
                  const finalPair = { top: sfW(0)||'TBD', bot: sfW(1)||'TBD' };

                  return (
                    <>
                      <div style={{ marginBottom:14 }}>
                        <div className="section-title">🏅 KNOCKOUT BRACKET</div>
                        <div style={{ fontSize:11, color:'rgba(255,255,255,0.35)', marginTop:4 }}>
                          Winners auto-advance round by round · Update scores in KO_MATCHES to populate
                        </div>
                      </div>

                      <div style={{ background: 'rgba(100,220,100,0.06)', border:'1px solid rgba(100,220,100,0.2)', borderRadius:10, padding:'10px 16px', marginBottom:18, display:'flex', alignItems:'center', gap:12 }}>
                        <span style={{ fontSize:18 }}>✅</span>
                        <div>
                          <div style={{ fontSize:12, fontWeight:600, color:'rgba(100,220,100,0.9)' }}>GROUP STAGE COMPLETE — R32 UNDERWAY</div>
                          <div style={{ fontSize:11, color:'rgba(255,255,255,0.4)', marginTop:2 }}>All 32 teams confirmed · R32 kicks off Jun 28</div>
                        </div>
                        <div style={{ marginLeft:'auto', fontSize:10, color:'rgba(255,255,255,0.25)' }}>72 / 72 GROUPS FINAL</div>
                      </div>

                      <div style={{ overflowX:'auto', paddingBottom:16 }}>
                        <div style={{ display:'flex', gap:0, minWidth:960 }}>

                          {/* R32 */}
                          <div style={{ minWidth:175 }}>
                            <ColHeader label="ROUND OF 32" pts="+5/TEAM" />
                            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                              {r32Pairs.map((p,i) => <MatchPair key={i} top={p.top} bot={p.bot} />)}
                            </div>
                          </div>

                          <Connector />

                          {/* R16 */}
                          <div style={{ minWidth:175 }}>
                            <ColHeader label="ROUND OF 16" pts="+8/TEAM" />
                            <div style={{ display:'flex', flexDirection:'column', gap:31 }}>
                              {r16Pairs.map((p,i) => <MatchPair key={i} top={p.top} bot={p.bot} />)}
                            </div>
                          </div>

                          <Connector />

                          {/* QF */}
                          <div style={{ minWidth:175 }}>
                            <ColHeader label="QUARTER-FINALS" pts="+10/TEAM" />
                            <div style={{ display:'flex', flexDirection:'column', gap:95 }}>
                              {qfPairs.map((p,i) => <MatchPair key={i} top={p.top} bot={p.bot} />)}
                            </div>
                          </div>

                          <Connector />

                          {/* SF */}
                          <div style={{ minWidth:175 }}>
                            <ColHeader label="SEMI-FINALS" pts="+20/TEAM" />
                            <div style={{ display:'flex', flexDirection:'column', gap:255 }}>
                              {sfPairs.map((p,i) => <MatchPair key={i} top={p.top} bot={p.bot} />)}
                            </div>
                          </div>

                          <Connector />

                          {/* Final */}
                          <div style={{ minWidth:175 }}>
                            <ColHeader label="FINAL" pts="+35/TEAM" />
                            <div style={{ display:'flex', flexDirection:'column', paddingTop:0 }}>
                              <MatchPair top={finalPair.top} bot={finalPair.bot} />
                            </div>
                          </div>

                          <Connector />

                          {/* Champion */}
                          <div style={{ minWidth:175, display:'flex', flexDirection:'column', justifyContent:'flex-start', paddingTop:30 }}>
                            <ColHeader label="CHAMPION" pts="+50/TEAM" />
                            <div style={{
                              background: champion ? 'linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,165,0,0.10))' : 'rgba(255,255,255,0.03)',
                              border: champion ? '2px solid rgba(255,215,0,0.55)' : '1px solid rgba(255,255,255,0.08)',
                              borderRadius:12, padding:'14px 16px',
                              boxShadow: champion ? '0 0 24px rgba(255,215,0,0.18)' : 'none',
                            }}>
                              <div style={{ fontSize:28, textAlign:'center', marginBottom:6 }}>
                                {champion ? getFlag3(champion) : '🏆'}
                              </div>
                              <div style={{ fontSize:13, fontWeight:800, color:'#ffd700', textAlign:'center', letterSpacing:1 }}>
                                {champion || 'TBD'}
                              </div>
                              {champion && getOwner3(champion) && (
                                <div style={{ fontSize:10, color:getOwnerColor(champion), textAlign:'center', marginTop:4, fontWeight:700 }}>
                                  {getOwner3(champion).emoji} {getOwner3(champion).name}
                                </div>
                              )}
                              <div style={{ fontSize:9, color:'rgba(255,255,255,0.3)', textAlign:'center', marginTop:4, letterSpacing:1 }}>
                                WINNER OF THE FINAL
                              </div>
                            </div>
                          </div>

                        </div>
                      </div>
                    </>
                  );

                })()}



                {tab === 'setup' && (

                  <>

                    <div className="row"><div className="section-title">MANAGE PLAYERS</div></div>

                    <div className="setup-grid">

                      {members.map(m => (

                        <div key={m.id} className="member-card">

                          <div className="member-header">

                            <div style={{ position: 'relative' }}>

                              <button className="member-emoji-btn" onClick={e => { e.stopPropagation(); setEmojiPicker(emojiPicker === m.id ? null : m.id); }}>{m.emoji}</button>

                              {emojiPicker === m.id && (

                                <div onClick={e => e.stopPropagation()} style={{ position: 'absolute', top: '40px', left: 0, zIndex: 100, background: '#1a2030', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '10px', padding: '8px', display: 'flex', flexWrap: 'wrap', gap: '5px', width: '150px' }}>

                                  {EMOJIS.map(e => (

                                    <button key={e} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '17px', padding: '2px' }} onClick={() => { updateMember(m.id, { emoji: e }); setEmojiPicker(null); }}>{e}</button>

                                  ))}

                                </div>

                              )}

                            </div>

                            <input className="member-name-input" value={m.name} onChange={e => updateMember(m.id, { name: e.target.value })} />

                            <button className="delete-member" onClick={() => deleteMember(m.id)}>✕</button>

                          </div>

                          <div className="member-team-count">{m.teams.length}/3 teams selected</div>

                          <div className="team-select-grid">

                            {ALL_TEAMS.map(t => {

                              const owned = m.teams.includes(t.name);

                              const takenByOther = !owned && assignedTeams.includes(t.name);

                              return (

                                <button key={t.name} className={`team-btn ${owned ? 'selected' : ''}`} disabled={takenByOther || (!owned && m.teams.length >= 3)} onClick={() => toggleTeam(m.id, t.name)}>

                                  {t.flag} {t.name}

                                </button>

                              );

                            })}

                          </div>

                        </div>

                      ))}

                      <button className="add-member-btn" onClick={addMember}>+ Add Player</button>

                    </div>

                  </>

                )}



                {/* GROUPS */}

                {tab === 'groups' && (

                  <>

                    <div className="section-title" style={{ marginBottom: 14 }}>ALL 12 GROUPS</div>

                    <div className="groups-grid">

                      {'ABCDEFGHIJKL'.split('').map(g => (

                        <div key={g} className="group-card">

                          <div className="group-label">Group {g}</div>

                          {ALL_TEAMS.filter(t => t.group === g).map(t => {

                            const owner = members.find(m => m.teams.includes(t.name));

                            return (

                              <div key={t.name} className="group-team">

                                <span>{t.flag}</span>

                                <span>{t.name}</span>

                                {owner && <span className="group-team-owner">{owner.emoji} {owner.name.split(' ')[0]}</span>}

                              </div>

                            );

                          })}

                        </div>

                      ))}

                    </div>

                  </>

                )}



                {/* PROGRESS */}

                {tab === 'progress' && (

                  <>

                    <div className="row">

                      <div className="section-title">TEAM PROGRESS</div>

                      <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)' }}>Update as matches happen</span>

                    </div>

                    {members.map(m => m.teams.length > 0 && (() => {
                        const allElim = m.teams.length > 0 && m.teams.every(tn => getTeamStage(tn, teamStatuses, KO_MATCHES) === 'eliminated');
                        return (
                      <div key={m.id} className={`progress-member${allElim ? ' busted' : ''}`}>

                        <div className="progress-member-title">{m.emoji} {m.name}{allElim && <span style={{ marginLeft:7, fontSize:16 }} title="All teams eliminated">💀</span>}</div>

                        {m.teams.map(teamName => {

                          const team = ALL_TEAMS.find(t => t.name === teamName);

                          const s = teamStatuses[teamName] || {};
                          const teamElim = getTeamStage(teamName, teamStatuses, KO_MATCHES) === 'eliminated';

                          return (

                            <div key={teamName} className={`progress-team-row${teamElim ? ' elim' : ''}`}>

                              <span style={{ minWidth: 110, fontSize: 12 }}>{teamElim && <span style={{ marginRight:4, fontSize:11 }}>❌</span>}{team?.flag} {teamName}</span>

                              <button className="counter-btn" onClick={() => setTeamStatuses(prev => ({ ...prev, [teamName]: { ...(prev[teamName] || {}), groupWins: ((prev[teamName]?.groupWins || 0) + 1) % 4 } }))} style={{ background: 'rgba(100,200,100,0.1)', border: '1px solid rgba(100,200,100,0.2)', color: 'rgba(100,255,100,0.8)' }}>W:{s.groupWins || 0}</button>

                              <button className="counter-btn" onClick={() => setTeamStatuses(prev => ({ ...prev, [teamName]: { ...(prev[teamName] || {}), groupDraws: ((prev[teamName]?.groupDraws || 0) + 1) % 4 } }))} style={{ background: 'rgba(200,200,80,0.1)', border: '1px solid rgba(200,200,80,0.2)', color: 'rgba(240,240,100,0.8)' }}>D:{s.groupDraws || 0}</button>

                              {[['eliminated','❌ Out'],['roundOf32','R32'],['quarterFinal','QF'],['semiFinal','SF'],['runnerUp','🥈'],['champion','🏆']].map(([field,label]) => (

                                <button key={field} className="stage-btn" onClick={() => toggleStatus(teamName, field)} style={{ background: s[field] ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.05)', border: s[field] ? '1px solid rgba(255,215,0,0.4)' : '1px solid rgba(255,255,255,0.1)', color: s[field] ? '#ffd700' : 'rgba(255,255,255,0.45)' }}>{label}</button>

                              ))}

                            </div>

                          );

                        })}

                      </div>
                        );
                      })()
                    )}

                    {members.every(m => m.teams.length === 0) && (

                      <div style={{ textAlign: 'center', color: 'rgba(255,255,255,0.25)', padding: '40px 0' }}>Assign teams in the Players tab first!</div>

                    )}

                  </>

                )}



                {/* TRASH TALK */}

                {tab === 'trash' && (

                  <>

                    <div className="section-title">💬 TRASH TALK BOARD</div>

                    <div className="trash-section">

                      <div className="trash-card">

                        <div className="trash-title">DROP YOUR HEAT 🔥</div>

                        <div className="trash-input-row">

                          <select className="trash-select" value={trashAuthor} onChange={e => setTrashAuthor(e.target.value)}>

                            <option value="">Who are you?</option>

                            {members.map(m => <option key={m.id} value={`${m.name} ${m.emoji}`}>{m.emoji} {m.name}</option>)}

                          </select>

                        </div>

                        <div className="trash-input-row">

                          <input

                            className="trash-text-input"

                            placeholder="Type your trash talk..."

                            value={trashText}

                            onChange={e => setTrashText(e.target.value)}

                            onKeyDown={e => e.key === 'Enter' && sendTrash()}

                            style={{ flex: 1 }}

                          />

                          <button className="trash-send-btn" onClick={sendTrash}>Send 🔥</button>

                        </div>

                      </div>

                      <div className="trash-card">

                        <div className="trash-title">THE FEED 📣</div>

                        <div className="trash-messages">

                          {trashMessages.length === 0

                            ? <div className="trash-empty">No trash talk yet... someone start it!</div>

                            : [...trashMessages].reverse().map(msg => (

                              <div key={msg.id} className="trash-msg">

                                <div className="trash-msg-author">{msg.author}</div>

                                <div className="trash-msg-text">{msg.text}</div>

                                <div className="trash-msg-time">{fmt(msg.time)}</div>

                              </div>

                            ))

                          }

                        </div>

                      </div>

                    </div>

                  </>

                )}



              </div>

            </div>

          </>

        );

      }



      ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    </script>

  </body>

</html>

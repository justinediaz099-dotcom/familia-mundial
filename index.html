      function calcScore(member, teamStatuses) {
        let pts = 0;
        member.teams.forEach(teamName => {
          const s = teamStatuses[teamName] || {};
          pts += (s.groupWins || 0) * POINTS.groupStageWin;
          pts += (s.groupDraws || 0) * POINTS.groupStageDraw;
          if (s.roundOf32) pts += POINTS.roundOf32;
          if (s.quarterFinal) pts += POINTS.quarterFinal;
          if (s.semiFinal) pts += POINTS.semiFinal;
          if (s.runnerUp) pts += POINTS.runnerUp;
          if (s.champion) pts += POINTS.champion;
        });
        return pts;
      }

      function getTeamStage(teamName, teamStatuses) {
        const s = teamStatuses[teamName] || {};
        if (s.champion) return 'champion';
        if (s.runnerUp || s.semiFinal || s.quarterFinal || s.roundOf32) return 'advancing';
        if (s.eliminated) return 'eliminated';
        return 'active';
      }

      function fmt(d) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          { id: 1, author: 'Chapetes ⚡', text: "Spain + Netherlands + Norway?? I'm basically ALREADY spending that $100 🤑", time: new Date() },

        ]);

        const [trashText, setTrashText] = useState('');

        const leaderboard = [...members]
          .map(m => ({ ...m, score: calcScore(m, teamStatuses) }))
          .sort((a, b) => b.score - a.score);

        const assignedTeams = members.flatMap(m => m.teams);

        const updateMember = (id, patch) => setMembers(prev => prev.map(m => (m.id === id ? { ...m, ...patch } : m)));
        const addMember = () => {
          const id = Date.now();
          setMembers(prev => [...prev, { id, name: `Player ${prev.length + 1}`, emoji: EMOJIS[prev.length % EMOJIS.length], teams: [] }]);
        };
        const deleteMember = id => setMembers(prev => prev.filter(m => m.id !== id));

                      maxWidth: 150,
                    }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <div style={{
                          width: 22, height: 22, borderRadius: '50%',
                          background: locked ? 'rgba(255,255,255,0.06)' : 'rgba(255,215,0,0.15)',
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 10, color: locked ? 'rgba(255,255,255,0.3)' : '#ffd700',
                          flexShrink: 0,
                        }}>
                          {locked ? '🔒' : '⚽'}
                        </div>
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: locked ? 'rgba(255,255,255,0.55)' : '#ffd700', whiteSpace: 'nowrap' }}>{label}</div>
                          {sub && <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.3)', marginTop: 1 }}>{sub}</div>}
                        </div>
                      </div>
                    </div>
                  );

                  const MatchPair = ({ topLabel, topSub, botLabel, botSub }) => (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                      <SlotCard label={topLabel} sub={topSub} />
                      <SlotCard label={botLabel} sub={botSub} />
                    </div>
                  );

                  const WinnerSlot = ({ label, sub }) => (
                    <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                      <SlotCard label={label} sub={sub} locked={false} />
                    </div>
                  );

                  // Build R32 match pairs (16 matches)
                  const r32Pairs = [];
                  for (let i = 0; i < R32.length; i += 2) {
                    r32Pairs.push([R32[i], R32[i + 1]]);
                  }

                  // Placeholder downstream slots
                  const mkSlots = (count, prefix) =>
                    Array.from({ length: count }, (_, i) => ({
                      label: `W ${prefix}-${i + 1}`,
                      sub: `W ${prefix}-${i + 1}`,
                    }));

                  const r16Slots  = mkSlots(16, 'r32');
                  const qfSlots   = mkSlots(8,  'r16');
                  const sfSlots   = mkSlots(4,  'qf');
                  const fSlots    = mkSlots(2,  'sf');

                  const ColHeader = ({ label, pts }) => (
                    <div style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 11, fontWeight: 600, color: 'rgba(255,255,255,0.7)', letterSpacing: 0.5 }}>{label}</div>
                      <div style={{ fontSize: 10, color: '#ffd700', letterSpacing: 1 }}>{pts}</div>
                    </div>
                  );

                  const Connector = () => (
                    <div style={{ display: 'flex', alignItems: 'center', alignSelf: 'stretch' }}>
                      <div style={{ width: 18, height: 2, background: 'rgba(255,255,255,0.1)' }} />
                    </div>
                  );

                  return (
                    <>
                      <div style={{ marginBottom: 14 }}>
                        <div className="section-title">🏅 KNOCKOUT BRACKET</div>
                        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.35)', marginTop: 4 }}>
                          Bracket locks in after group stage ends · Top 2 per group + 8 best 3rd-place teams advance
                        </div>
                      </div>

                      {/* Locked banner */}
                      <div style={{ background: 'rgba(255,165,0,0.08)', border: '1px solid rgba(255,165,0,0.2)', borderRadius: 10, padding: '10px 16px', marginBottom: 20, display: 'flex', alignItems: 'center', gap: 10 }}>
                        <span style={{ fontSize: 18 }}>🔒</span>
                        <div>
                          <div style={{ fontSize: 12, fontWeight: 600, color: 'rgba(255,200,80,0.9)' }}>BRACKET FORMS AFTER GROUP STAGE</div>
                          <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.4)', marginTop: 2 }}>Round of 32 slots fill automatically · 1/72 groups final</div>
                        </div>
                        <div style={{ marginLeft: 'auto', fontSize: 10, color: 'rgba(255,255,255,0.25)' }}>1 / 72 GROUPS FINAL</div>
                      </div>

                      {/* Bracket scroll area */}
                      <div style={{ overflowX: 'auto', paddingBottom: 16 }}>
                        <div style={{ display: 'flex', gap: 0, minWidth: 900 }}>

                          {/* R32 */}
                          <div style={{ minWidth: 170 }}>
                            <ColHeader label="ROUND OF 32" pts="+2/TEAM" />
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                              {r32Pairs.map((pair, i) => (
                                <MatchPair key={i}
                                  topLabel={pair[0].label} topSub={pair[0].sub}
                                  botLabel={pair[1].label} botSub={pair[1].sub}
                                />
                              ))}
                            </div>
                          </div>

                          <Connector />

                          {/* R16 */}
                          <div style={{ minWidth: 170 }}>
                            <ColHeader label="ROUND OF 16" pts="+3/TEAM" />
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 31 }}>
                              {Array.from({ length: 8 }, (_, i) => (
                                <MatchPair key={i}
                                  topLabel={r16Slots[i * 2].label}     topSub={r16Slots[i * 2].sub}
                                  botLabel={r16Slots[i * 2 + 1].label} botSub={r16Slots[i * 2 + 1].sub}
                                />
                              ))}
                            </div>
                          </div>

                          <Connector />

                          {/* QF */}
                          <div style={{ minWidth: 170 }}>
                            <ColHeader label="QUARTER-FINALS" pts="+5/TEAM" />
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 95 }}>
                              {Array.from({ length: 4 }, (_, i) => (
                                <MatchPair key={i}
                                  topLabel={qfSlots[i * 2].label}     topSub={qfSlots[i * 2].sub}
                                  botLabel={qfSlots[i * 2 + 1].label} botSub={qfSlots[i * 2 + 1].sub}
                                />
                              ))}
                            </div>
                          </div>

                          <Connector />

                          {/* SF */}
                          <div style={{ minWidth: 170 }}>
                            <ColHeader label="SEMI-FINALS" pts="+8/TEAM" />
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 255 }}>
                              {Array.from({ length: 2 }, (_, i) => (
                                <MatchPair key={i}
                                  topLabel={sfSlots[i * 2].label}     topSub={sfSlots[i * 2].sub}
                                  botLabel={sfSlots[i * 2 + 1].label} botSub={sfSlots[i * 2 + 1].sub}
                                />
                              ))}
                            </div>
                          </div>

                          <Connector />

                          {/* FINAL */}
                          <div style={{ minWidth: 170 }}>
                            <ColHeader label="FINAL" pts="+12/TEAM" />
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 600, paddingTop: 0 }}>
                              <MatchPair
                                topLabel={fSlots[0].label} topSub={fSlots[0].sub}
                                botLabel={fSlots[1].label} botSub={fSlots[1].sub}
                              />
                            </div>
                          </div>

                          <Connector />

                          {/* CHAMPION */}
                          <div style={{ minWidth: 160, display: 'flex', flexDirection: 'column', justifyContent: 'flex-start', paddingTop: 30 }}>
                            <ColHeader label="🏆 CHAMPION" pts="+20/TEAM" />
                            <div style={{
                              background: 'rgba(255,215,0,0.07)',
                              border: '1px solid rgba(255,215,0,0.3)',
                              borderRadius: 10, padding: '12px 14px',
                            }}>
                              <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', marginBottom: 4 }}>🏆 CHAMPION</div>
                              <div style={{ fontSize: 13, fontWeight: 700, color: '#ffd700' }}>TBD</div>
                              <div style={{ fontSize: 9, color: 'rgba(255,255,255,0.25)', marginTop: 3 }}>Winner of the Final</div>
                            </div>
                          </div>

                        </div>
                      </div>
                    </>
                  );
                })()}

                {tab === 'setup' && (
                  <>
                    <div className="row"><div className="section-title">MANAGE PLAYERS</div></div>
                    <div className="setup-grid">
                      {members.map(m => (
                        <div key={m.id} className="member-card">
                          <div className="member-header">
                            <div style={{ position: 'relative' }}>
                              <button className="member-emoji-btn" onClick={e => { e.stopPropagation(); setEmojiPicker(emojiPicker === m.id ? null : m.id); }}>{m.emoji}</button>
                              {emojiPicker === m.id && (
                                <div onClick={e => e.stopPropagation()} style={{ position: 'absolute', top: '40px', left: 0, zIndex: 100, background: '#1a2030', border: '1px solid rgba(255,255,255,0.12)', borderRadius: '10px', padding: '8px', display: 'flex', flexWrap: 'wrap', gap: '5px', width: '150px' }}>
                                  {EMOJIS.map(e => (
                                    <button key={e} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '17px', padding: '2px' }} onClick={() => { updateMember(m.id, { emoji: e }); setEmojiPicker(null); }}>{e}</button>
                                  ))}
                                </div>
                              )}
                            </div>
                            <input className="member-name-input" value={m.name} onChange={e => updateMember(m.id, { name: e.target.value })} />
                            <button className="delete-member" onClick={() => deleteMember(m.id)}>✕</button>
                          </div>
                          <div className="member-team-count">{m.teams.length}/3 teams selected</div>
                          <div className="team-select-grid">
                            {ALL_TEAMS.map(t => {
                              const owned = m.teams.includes(t.name);
                              const takenByOther = !owned && assignedTeams.includes(t.name);
                              return (
                                <button key={t.name} className={`team-btn ${owned ? 'selected' : ''}`} disabled={takenByOther || (!owned && m.teams.length >= 3)} onClick={() => toggleTeam(m.id, t.name)}>
                                  {t.flag} {t.name}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                      <button className="add-member-btn" onClick={addMember}>+ Add Player</button>
                    </div>
                  </>
                )}

                {/* GROUPS */}
                {tab === 'groups' && (
                  <>
                    <div className="section-title" style={{ marginBottom: 14 }}>ALL 12 GROUPS</div>
                    <div className="groups-grid">
                      {'ABCDEFGHIJKL'.split('').map(g => (
                        <div key={g} className="group-card">
                          <div className="group-label">Group {g}</div>
                          {ALL_TEAMS.filter(t => t.group === g).map(t => {
                            const owner = members.find(m => m.teams.includes(t.name));
                            return (
                              <div key={t.name} className="group-team">
                                <span>{t.flag}</span>
                                <span>{t.name}</span>
                                {owner && <span className="group-team-owner">{owner.emoji} {owner.name.split(' ')[0]}</span>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {/* PROGRESS */}
                {tab === 'progress' && (
                  <>
                    <div className="row">
                      <div className="section-title">TEAM PROGRESS</div>
                      <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)' }}>Update as matches happen</span>
                    </div>
                    {members.map(m => m.teams.length > 0 && (
                      <div key={m.id} className="progress-member">
                        <div className="progress-member-title">{m.emoji} {m.name}</div>
                        {m.teams.map(teamName => {
                          const team = ALL_TEAMS.find(t => t.name === teamName);
                          const s = teamStatuses[teamName] || {};
                          return (
                            <div key={teamName} className="progress-team-row">
                              <span style={{ minWidth: 110, fontSize: 12 }}>{team?.flag} {teamName}</span>
                              <button className="counter-btn" onClick={() => setTeamStatuses(prev => ({ ...prev, [teamName]: { ...(prev[teamName] || {}), groupWins: ((prev[teamName]?.groupWins || 0) + 1) % 4 } }))} style={{ background: 'rgba(100,200,100,0.1)', border: '1px solid rgba(100,200,100,0.2)', color: 'rgba(100,255,100,0.8)' }}>W:{s.groupWins || 0}</button>
                              <button className="counter-btn" onClick={() => setTeamStatuses(prev => ({ ...prev, [teamName]: { ...(prev[teamName] || {}), groupDraws: ((prev[teamName]?.groupDraws || 0) + 1) % 4 } }))} style={{ background: 'rgba(200,200,80,0.1)', border: '1px solid rgba(200,200,80,0.2)', color: 'rgba(240,240,100,0.8)' }}>D:{s.groupDraws || 0}</button>
                              {[['eliminated','❌ Out'],['roundOf32','R32'],['quarterFinal','QF'],['semiFinal','SF'],['runnerUp','🥈'],['champion','🏆']].map(([field,label]) => (
                                <button key={field} className="stage-btn" onClick={() => toggleStatus(teamName, field)} style={{ background: s[field] ? 'rgba(255,215,0,0.18)' : 'rgba(255,255,255,0.05)', border: s[field] ? '1px solid rgba(255,215,0,0.4)' : '1px solid rgba(255,255,255,0.1)', color: s[field] ? '#ffd700' : 'rgba(255,255,255,0.45)' }}>{label}</button>
                              ))}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                    {members.every(m => m.teams.length === 0) && (
                      <div style={{ textAlign: 'center', color: 'rgba(255,255,255,0.25)', padding: '40px 0' }}>Assign teams in the Players tab first!</div>
                    )}
                  </>
                )}

                {/* TRASH TALK */}
                {tab === 'trash' && (
                  <>
                    <div className="section-title">💬 TRASH TALK BOARD</div>
                    <div className="trash-section">
                      <div className="trash-card">
                        <div className="trash-title">DROP YOUR HEAT 🔥</div>
                        <div className="trash-input-row">
                          <select className="trash-select" value={trashAuthor} onChange={e => setTrashAuthor(e.target.value)}>
                            <option value="">Who are you?</option>
                            {members.map(m => <option key={m.id} value={`${m.name} ${m.emoji}`}>{m.emoji} {m.name}</option>)}
                          </select>
                        </div>
                        <div className="trash-input-row">
                          <input
                            className="trash-text-input"
                            placeholder="Type your trash talk..."
                            value={trashText}
                            onChange={e => setTrashText(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && sendTrash()}
                            style={{ flex: 1 }}
                          />
                          <button className="trash-send-btn" onClick={sendTrash}>Send 🔥</button>
                        </div>
                      </div>
                      <div className="trash-card">
                        <div className="trash-title">THE FEED 📣</div>
                        <div className="trash-messages">
                          {trashMessages.length === 0
                            ? <div className="trash-empty">No trash talk yet... someone start it!</div>
                            : [...trashMessages].reverse().map(msg => (
                              <div key={msg.id} className="trash-msg">
                                <div className="trash-msg-author">{msg.author}</div>
                                <div className="trash-msg-text">{msg.text}</div>
                                <div className="trash-msg-time">{fmt(msg.time)}</div>
                              </div>
                            ))
                          }
                        </div>
                      </div>
                    </div>
                  </>
                )}

              </div>
            </div>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
